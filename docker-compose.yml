# =============================================================================
# Campus Resource Engine - Docker Compose Configuration
# =============================================================================
# Development environment setup with PostgreSQL and Redis
# 
# Usage:
#   docker-compose up -d        # Start all services
#   docker-compose down         # Stop all services
#   docker-compose logs -f      # View logs
# =============================================================================

version: '3.8'

services:
  # ===========================================================================
  # PostgreSQL Database (Supabase-compatible)
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: campus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: campus_resource_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Initialize with btree_gist extension for EXCLUDE constraints
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_network

  # ===========================================================================
  # Redis (Caching & Job Queue)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: campus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - campus_network

  # ===========================================================================
  # Redis Commander (Redis GUI - Development Only)
  # ===========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: campus_redis_commander
    restart: unless-stopped
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    profiles:
      - dev
    networks:
      - campus_network

  # ===========================================================================
  # pgAdmin (PostgreSQL GUI - Development Only)
  # ===========================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: campus_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@campus.edu
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - dev
    networks:
      - campus_network

# ===========================================================================
# Named Volumes
# ===========================================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ===========================================================================
# Networks
# ===========================================================================
networks:
  campus_network:
    driver: bridge
